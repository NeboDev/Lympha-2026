# Validación de cada pull request (y de main, para que el despliegue a staging dependa de un CI en verde).
# Objetivo del plan: menos de 10 minutos. Las acciones están fijadas por SHA de commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  calidad:
    name: Lint, tipos y pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome (formato y lint)
        run: pnpm lint
      - name: Tipos (tsc --noEmit)
        run: pnpm typecheck
      - name: Unitarias (incluye la cobertura de aislamiento de rutas)
        run: pnpm test

  integracion:
    name: Integración (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Postgres+Timescale, Valkey y Mosquitto reales; aplica todas las migraciones sobre una base vacía y
      # corre el flujo MQTT -> cola -> worker -> Postgres y las pruebas de aislamiento encima.
      - name: Integración
        run: pnpm test:int

  infra:
    name: Scripts y Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck infra/deploy.sh infra/smoke.sh infra/bootstrap/*.sh infra/postgres/init-roles.sh infra/mosquitto/*.sh infra/valkey/entrypoint.sh infra/test/deploy.test.sh
      - name: Pruebas de deploy.sh (rollback, orden, secretos)
        run: bash infra/test/deploy.test.sh
      - name: Compose de desarrollo es válido
        run: docker compose -f infra/compose/base.yml -f infra/compose/dev.yml config -q
      - name: Compose de staging/producción es válido y publica solo 80, 443, 8883 (y 3000 en loopback)
        run: bash infra/test/prod-compose.test.sh

  imagen:
    name: Imagen y vulnerabilidades (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construye la imagen del servidor (sin publicarla)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: runtime
          load: true
          push: false
          tags: lympha-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy sobre dependencias del repositorio (falla con severidad alta o crítica)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy sobre la imagen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lympha-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
