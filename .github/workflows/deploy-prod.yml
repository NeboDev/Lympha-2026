# Una etiqueta vAAAA.MM.N publica la imagen y la despliega a prod-1 tras una aprobación manual
# (configura "Required reviewers" en el entorno "production" de GitHub). deploy.sh respalda Postgres antes
# de migrar y, si fallan las pruebas de humo, regresa solo a la versión anterior.
# Secretos del entorno "production": PRODUCTION_HOST, PRODUCTION_SSH_KEY, PRODUCTION_SSH_KNOWN_HOSTS.
name: Deploy production

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - id: version
        run: |
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "propietario=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: runtime
          push: true
          build-args: APP_VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/${{ steps.version.outputs.propietario }}/lympha-server:${{ steps.version.outputs.sha }}
            ghcr.io/${{ steps.version.outputs.propietario }}/lympha-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar a prod-1 (requiere aprobación)
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Configura SSH
        env:
          CLAVE: ${{ secrets.PRODUCTION_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: deploy.sh en el servidor
        env:
          SHA: ${{ needs.publicar.outputs.sha }}
          HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "deploy@$HOST" \
            "set -euo pipefail; cd /srv/lympha && git fetch --depth 1 origin $SHA && git checkout --detach $SHA && ./infra/deploy.sh production $SHA"
