# ESTADO: escrito y documentado, NO probado contra un servidor real (por ahora no hay VPS; ver docs/decisiones.md,
# "Modo local"). Lo que sí está probado: infra/deploy.sh con simulacros (pnpm test:infra) y, para el ensayo
# completo, la VM de Multipass (infra/staging-local). Se prueba contra un VPS al inicio de H5.
# Cada merge a main (con el CI en verde) publica la imagen y la despliega a staging-1 por SSH.
# Secretos del entorno "staging" en GitHub: STAGING_HOST, STAGING_SSH_KEY (llave privada del usuario deploy)
# y STAGING_SSH_KNOWN_HOSTS (salida de `ssh-keyscan` verificada a mano; evita confiar en la primera conexión).
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar imagen en GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      imagen: ${{ steps.version.outputs.imagen }}
    steps:
      - id: version
        run: |
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          propietario="${GITHUB_REPOSITORY_OWNER,,}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "imagen=ghcr.io/$propietario/lympha-server" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.version.outputs.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          target: runtime
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.sha }}
          tags: ${{ steps.version.outputs.imagen }}:${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar a staging-1
    needs: publicar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Configura SSH
        env:
          CLAVE: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: deploy.sh en el servidor
        env:
          SHA: ${{ needs.publicar.outputs.sha }}
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          # Primero se trae el código de infra de ese commit (incluido deploy.sh) y luego se despliega.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "deploy@$HOST" \
            "set -euo pipefail; cd /srv/lympha && git fetch --depth 1 origin $SHA && git checkout --detach $SHA && ./infra/deploy.sh staging $SHA"
