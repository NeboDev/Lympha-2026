# Desarrollo local:
#   docker compose -f infra/compose/base.yml -f infra/compose/dev.yml up
# Con recarga al guardar (sincroniza src/ y reinicia el proceso):  ... up --watch
# Todo escucha solo en 127.0.0.1. Las variables salen de dev.env (valores de desarrollo, no secretos).
x-dev-servidor: &dev-servidor
  image: lympha-server:dev
  pull_policy: never
  build:
    context: ../..
    dockerfile: apps/server/Dockerfile
    target: dev
  env_file: [dev.env]
  develop:
    watch:
      - { path: ../../apps/server/src, target: /app/apps/server/src, action: sync+restart }
      - { path: ../../apps/server/migrations, target: /app/apps/server/migrations, action: sync }
      - { path: ../../packages/contracts/src, target: /app/packages/contracts/src, action: sync+restart }
      - { path: ../../packages/wqi/src, target: /app/packages/wqi/src, action: sync+restart }
      - { path: ../../apps/server/package.json, action: rebuild }

services:
  postgres:
    env_file: [dev.env]
    ports: ["127.0.0.1:5432:5432"]

  valkey:
    env_file: [dev.env]
    ports: ["127.0.0.1:6379:6379"]

  # CA propia (infra/certs/ca.crt + ca.key, que persiste) y certificado de servidor para el 8883. `pnpm certs` lo renueva
  # o agrega nombres con CERT_SANS (p. ej. la IP de tu equipo para un nodo de prueba).
  certs:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "/gen-dev-certs.sh"]
    environment:
      CERT_SANS: ${CERT_SANS:-}
    volumes:
      - ../mosquitto/gen-dev-certs.sh:/gen-dev-certs.sh:ro
      - mosquittocerts:/out/server
      - ../certs:/out/ca
    restart: "no"

  mosquitto:
    env_file: [dev.env]
    depends_on:
      certs: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8883:8883"

  # Emulador de Firebase Auth (solo local): la API acepta sus tokens sin firma. Proyecto: lympha-dev.
  firebase-auth:
    build:
      context: ../firebase
    image: lympha-firebase-auth:dev
    pull_policy: never
    profiles: [emulador]
    ports: ["127.0.0.1:9099:9099"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *dev-servidor

  mqtt-bootstrap:
    <<: *dev-servidor

  # Semillas de desarrollo (equivale a `pnpm db:seed`): usuario, espacio, nodo y su cliente MQTT.
  seed:
    <<: *dev-servidor
    command: ["src/cli/seed.ts"]
    restart: "no"
    depends_on:
      migrate: { condition: service_completed_successfully }
      mqtt-bootstrap: { condition: service_completed_successfully }

  # Cada proceso entra a Valkey con su propio usuario ACL.
  # TELEGRAM_BOT_TOKEN (y, si usas un túnel, PUBLIC_API_URL y TELEGRAM_WEBHOOK_SECRET) salen de tu .env, que no se
  # versiona (ver .env.example). Sin PUBLIC_API_URL el bot usa long polling.
  api:
    <<: *dev-servidor
    depends_on:
      firebase-auth: { condition: service_healthy, required: false }
    environment:
      VALKEY_URL: redis://api:dev-valkey-api@valkey:6379
      # FIREBASE_USE_EMULATOR=true (por defecto) usa el emulador; false verifica tokens del proyecto real lympha-dev.
      FIREBASE_USE_EMULATOR: ${FIREBASE_USE_EMULATOR:-true}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-auth:9099
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      # Orígenes de la PWA (Vite en :5173 y `vite preview` en :4173); se pueden cambiar en tu .env.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:4173}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    ports: ["127.0.0.1:3000:3000"]

  ingest:
    <<: *dev-servidor
    environment:
      VALKEY_URL: redis://ingest:dev-valkey-ingest@valkey:6379

  worker:
    <<: *dev-servidor
    environment:
      VALKEY_URL: redis://worker:dev-valkey-worker@valkey:6379

  # Envía los avisos del outbox. Sin TELEGRAM_BOT_TOKEN en tu .env no envía y los avisos esperan en la bandeja.
  notifier:
    <<: *dev-servidor
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
