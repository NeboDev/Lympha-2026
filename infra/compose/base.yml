# Base común a todos los entornos. Las variables y secretos entran por `env_file` en dev.yml / prod.yml;
# aquí no hay valores secretos. Los puertos solo se publican en los archivos de entorno.
name: lympha

# Una sola imagen con cuatro comandos. En dev se construye; en staging/producción se toma de GHCR.
x-servidor: &servidor
  image: ${LYMPHA_IMAGE:-lympha-server:dev}
  init: true

x-proceso: &proceso
  <<: *servidor
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }
    mqtt-bootstrap: { condition: service_completed_successfully }
    valkey: { condition: service_healthy }

services:
  postgres:
    image: timescale/timescaledb:2.26.0-pg16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=500ms
      - -c
      - timescaledb.max_background_workers=8
      - -c
      - max_worker_processes=16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/lympha-entrypoint.sh"]
    volumes:
      - valkeydata:/data
      - ../valkey/entrypoint.sh:/usr/local/bin/lympha-entrypoint.sh:ro
      - ../valkey/valkey.conf.tpl:/etc/valkey/valkey.conf.tpl:ro
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --user api --pass \"$$VALKEY_PW_API\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/lympha-entrypoint.sh"]
    volumes:
      - mosquittodata:/mosquitto/data
      - mosquittocerts:/mosquitto/certs:ro
      - ../mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../mosquitto/entrypoint.sh:/usr/local/bin/lympha-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 1883"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Jobs de una sola ejecución (misma imagen que los procesos).
  migrate:
    <<: *servidor
    command: ["src/cli/migrate.ts"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  mqtt-bootstrap:
    <<: *servidor
    command: ["src/cli/mqtt-bootstrap.ts"]
    restart: "no"
    depends_on:
      mosquitto: { condition: service_healthy }

  # Los cuatro procesos.
  api:
    <<: *proceso
    command: ["src/main/api.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ingest:
    <<: *proceso
    command: ["src/main/ingest.ts"]

  worker:
    <<: *proceso
    command: ["src/main/worker.ts"]

  notifier:
    <<: *proceso
    command: ["src/main/notifier.ts"]

volumes:
  pgdata:
  valkeydata:
  mosquittodata:
  mosquittocerts:
